version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: raw_customers
      - name: raw_products
      - name: raw_orders
      - name: raw_order_items
      - name: raw_payments

models:
  - name: stg_customers
    description: >
      One row per customer record as it appeared in a source batch.
      Not deduplicated here -- see dim_customers (SCD2 snapshot) for
      the current/historical dimension.
    columns:
      - name: customer_id
        description: Natural key for a customer.
        data_tests:
          - not_null
      - name: email
        data_tests:
          - not_null:
              config:
                severity: warn
                where: "true"
      - name: country
        data_tests:
          - not_null

  - name: stg_products
    description: Product catalog, one row per product.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: unit_price
        data_tests:
          - not_null

  - name: stg_orders
    description: One row per order.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              values: ['completed', 'cancelled', 'returned']

  - name: stg_order_items
    description: One row per line item within an order.
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: quantity
        data_tests:
          - not_null

  - name: stg_payments
    description: One row per payment attempt against an order.
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: payment_status
        data_tests:
          - accepted_values:
              values: ['success', 'failed']
